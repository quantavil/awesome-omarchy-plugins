name: 🧩 Suggest a New Plugin
description: Submit a new Omarchy plugin to be added to the catalog.
title: "[Plugin Submission]: <Plugin Name>"
labels: ["plugin-submission", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an Omarchy plugin! 🎉
        Please make sure the repository is open-source and listed in (or eligible for)
        the omarchy-plugin-marketplace registry.

  - type: input
    id: repo_url
    attributes:
      label: Repository URL
      description: The public URL of the plugin repository (GitHub).
      placeholder: https://github.com/owner/repository
    validations:
      required: true

  - type: input
    id: plugin_id
    attributes:
      label: Plugin ID (Optional)
      description: The plugin ID as declared in the manifest. Leave blank if same as repository name.
      placeholder: my.cool-widget
    validations:
      required: false

  - type: input
    id: plugin_name
    attributes:
      label: Plugin Name (Optional)
      description: Leave blank if same as repository name.
      placeholder: Cool Widget
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Select the category that best fits this plugin.
      options:
        - "Widgets"
        - "Productivity"
        - "System"
        - "Hardware"
        - "Desktop"
        - "Developer Tools"
        - "Appearance"
        - "Other"
        - "Kids"
        - "Other / Let script infer"
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: Tags (Optional)
      description: Comma-separated tags, e.g. bar, quickshell, system.
      placeholder: bar, quickshell
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Brief Description (Optional)
      description: A 1-2 sentence description. If blank, the repository description will be used.
      placeholder: A minimal bar widget showing system stats.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Submission Checklist
      options:
        - label: The source code is publicly accessible under an open-source license.
          required: true
        - label: This is an Omarchy shell plugin (quickshell / bar / widget / suite).
          required: true
        - label: The plugin is functional and not an empty template.
          required: true
