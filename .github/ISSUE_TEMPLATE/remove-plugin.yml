name: 🗑️ Request Plugin Removal
description: Request the removal of an existing plugin from the catalog.
title: "[Removal Request]: <Plugin Name or Repo>"
labels: ["plugin-removal", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please use this form to report plugins that no longer qualify for the **Awesome Omarchy Plugins** list.

  - type: input
    id: repo_url
    attributes:
      label: Plugin Repository URL or Plugin ID
      description: The repository URL, owner/repo slug, or plugin ID to remove.
      placeholder: https://github.com/owner/repository
    validations:
      required: true

  - type: checkboxes
    id: removal_reason
    attributes:
      label: Reason for Removal
      description: Select all applicable reasons.
      options:
        - label: Repository has been deleted, privated, or gone 404.
        - label: Project became closed-source / proprietary.
        - label: Plugin was retired from the upstream marketplace registry.
        - label: Entry is broken, empty, or a placeholder with no functionality.
        - label: Removal requested by the original repository owner/author.
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Additional Details & Context
      description: Provide any additional context or proof supporting the removal request.
      placeholder: Provide details explaining why this plugin should be removed.
    validations:
      required: false
