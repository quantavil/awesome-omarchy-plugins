<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="100%">
  <defs>
    <!-- Dark Omarchy Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d10" />
      <stop offset="50%" stop-color="#12151b" />
      <stop offset="100%" stop-color="#0b0d10" />
    </linearGradient>

    <!-- Omarchy Official Signature Jade to Cyan Gradient -->
    <linearGradient id="omarchyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9ece6a" />
      <stop offset="60%" stop-color="#73daca" />
      <stop offset="100%" stop-color="#7dcfff" />
    </linearGradient>

    <!-- Subtle Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(158, 206, 106, 0.45)" />
      <stop offset="50%" stop-color="rgba(115, 218, 202, 0.2)" />
      <stop offset="100%" stop-color="rgba(125, 207, 255, 0.35)" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="rgba(255, 255, 255, 0.04)" />
    </pattern>
  </defs>

  <!-- Base Card -->
  <rect width="900" height="200" rx="16" fill="url(#bgGrad)" />
  <rect width="900" height="200" rx="16" fill="url(#dotGrid)" />
  <rect width="900" height="200" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Ambient Light Orbs -->
  <circle cx="115" cy="100" r="85" fill="#9ece6a" opacity="0.14" filter="url(#glow)" />
  <circle cx="820" cy="90" r="95" fill="#7dcfff" opacity="0.08" filter="url(#glow)" />

  <!-- Standalone Official Omarchy Logo (Exact vector path from omarchy.org) -->
  <g transform="translate(48, 38)">
    <!-- Logo Glow Aura -->
    <circle cx="62" cy="62" r="55" fill="#9ece6a" opacity="0.08" filter="url(#glow)" />

    <!-- Pure Vector Official Omarchy Mark -->
    <svg width="124" height="124" viewBox="0 0 1200 1200" fill="none">
      <path clip-rule="evenodd" d="m1200 1200h-480v-80h400v-1040h-479.996v160h-400v720h720v-720h-80v-80h159.996v880h-400v160h-640v-1200h1200zm-1120-80h480v-80h-400l.004-400h-80.004zm0-560h80.004v-400h400v-80h-480.004z" fill="url(#omarchyGrad)" fill-rule="evenodd" />
    </svg>
  </g>

  <!-- Typography & Information -->
  <g transform="translate(205, 25)">
    <!-- Top Pill / Category -->
    <rect x="0" y="8" width="224" height="22" rx="11" fill="rgba(158, 206, 106, 0.12)" stroke="rgba(158, 206, 106, 0.3)" stroke-width="1" />
    <circle cx="12" cy="19" r="3.5" fill="#9ece6a" />
    <text x="23" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9ece6a" letter-spacing="1.5" dominant-baseline="central">OMARCHY ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="url(#omarchyGrad)" letter-spacing="0.2">Awesome Omarchy Plugins</text>

    <!-- Description -->
    <text x="0" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9ca3af">
      A curated directory of 2,600+ plugins, widgets, and status bars with live stats.
    </text>

    <!-- Pills / Badges -->
    <g transform="translate(0, 120)">
      <!-- Pill 1: Quickshell -->
      <g transform="translate(0, 0)">
        <rect width="112" height="24" rx="6" fill="#181c25" stroke="rgba(158, 206, 106, 0.3)" stroke-width="1" />
        <circle cx="12" cy="12" r="3" fill="#9ece6a" />
        <text x="22" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#d1d5db" dominant-baseline="central">Quickshell</text>
      </g>

      <!-- Pill 2: QML Shell -->
      <g transform="translate(120, 0)">
        <rect width="98" height="24" rx="6" fill="#181c25" stroke="rgba(115, 218, 202, 0.3)" stroke-width="1" />
        <circle cx="12" cy="12" r="3" fill="#73daca" />
        <text x="22" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#d1d5db" dominant-baseline="central">QML Shell</text>
      </g>

      <!-- Pill 3: Hyprland / Arch -->
      <g transform="translate(226, 0)">
        <rect width="126" height="24" rx="6" fill="#181c25" stroke="rgba(125, 207, 255, 0.3)" stroke-width="1" />
        <circle cx="12" cy="12" r="3" fill="#7dcfff" />
        <text x="22" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#d1d5db" dominant-baseline="central">Arch + Hyprland</text>
      </g>

      <!-- Pill 4: 2,600+ Plugins -->
      <g transform="translate(360, 0)">
        <rect width="130" height="24" rx="6" fill="#181c25" stroke="rgba(187, 154, 247, 0.3)" stroke-width="1" />
        <circle cx="12" cy="12" r="3" fill="#bb9af7" />
        <text x="22" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#d1d5db" dominant-baseline="central">2,600+ Plugins</text>
      </g>

      <!-- Pill 5: Live Stats -->
      <g transform="translate(498, 0)">
        <rect width="105" height="24" rx="6" fill="#181c25" stroke="rgba(224, 175, 104, 0.3)" stroke-width="1" />
        <circle cx="12" cy="12" r="3" fill="#e0af68" />
        <text x="22" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#d1d5db" dominant-baseline="central">Live Stats</text>
      </g>
    </g>
  </g>
</svg>
